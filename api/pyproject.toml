[project]
name = "grit-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "asyncpg-stubs>=0.29",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "N",
  "UP",
  "B",
  "S",
  "C4", "C90",
  "SIM", "RET", "ARG",
  "PL",
  "PT",
  "DTZ",
  "T20",
  "RUF",
]
ignore = ["B008"]
# Typographic quotes and dashes appear in PRD notification copy on purpose.
allowed-confusables = ["’", "“", "”", "–"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 5
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pylint.format]
max-module-lines = 500

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov-report=xml --cov-report=term-missing"
