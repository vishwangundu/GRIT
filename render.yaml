# Render blueprint for the FastAPI service. Secrets are entered in the Render dashboard.
services:
  - type: web
    name: grit-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
