# CODING_STANDARDS section 13: file-size check -> lint -> typecheck -> tests -> SonarCloud.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-file-size.sh

  api:
    needs: file-size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy app scripts
      - name: Tests
        run: uv run pytest
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage.xml

  web:
    needs: file-size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint && npx prettier --check .
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/lcov.info

  sonar:
    needs: [api, web]
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: api
      - uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
